<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevMatchMaker⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSlow: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: 0.8 },
                        }
                    },
                    animation: {
                        fadeInUp: 'fadeInUp 0.5s ease-out forwards',
                        pulseSlow: 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        [v-cloak] { display: none; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .smooth-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center mb-12 py-4 border-b border-gray-100 animate-fadeInUp">
            <div class="flex items-center gap-2">
                <span class="text-4xl animate-pulseSlow">⚡</span>
                <h1 class="text-3xl font-extrabold tracking-tighter text-gray-950">
                    DevMatch<span class="text-indigo-600">Maker</span>
                </h1>
            </div>
            
            <div id="auth-section">
                <button onclick="login()" class="smooth-transition bg-indigo-600 text-white px-6 py-2.5 rounded-full font-bold text-sm hover:bg-indigo-700 hover:scale-105 hover:shadow-lg active:scale-95">
                    Login with Google
                </button>
            </div>
        </header>

        <div class="grid md:grid-cols-12 gap-10">
            
            <!-- LEFT COLUMN -->
            <aside class="md:col-span-4 space-y-8">
                <!-- Search Box -->
                <div class="bg-white p-7 rounded-3xl shadow-sm border border-gray-100 animate-fadeInUp delay-1 opacity-0">
                    <h2 class="font-bold text-xl mb-1 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Find Your Stack
                    </h2>
                    <p class="text-gray-500 text-sm mb-5">Type skills you need, separated by commas.</p>
                    
                    <input type="text" id="skillSearch" oninput="renderFeed()" placeholder="e.g. React, Python, Figma" 
                        class="smooth-transition w-full border-2 border-gray-100 rounded-xl p-4 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none">
                </div>

                <!-- Profile Post Form -->
                <div id="profile-form-container" class="hidden transform transition-all duration-500 ease-out translate-y-10 opacity-0 bg-indigo-950 text-white p-7 rounded-3xl shadow-xl">
                    <h2 class="font-bold text-xl mb-5 flex items-center gap-2">
                        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        Post Your Profile
                    </h2>
                    <form id="postForm" class="space-y-4">
                        <input type="text" id="role" placeholder="Desired Role (e.g. Frontend Dev)" class="smooth-transition w-full p-3.5 rounded-xl bg-indigo-900 border border-indigo-800 text-white placeholder-indigo-300 focus:border-green-400 outline-none" required>
                        <input type="text" id="skills" placeholder="Your Skills (React, JS, Python)" class="smooth-transition w-full p-3.5 rounded-xl bg-indigo-900 border border-indigo-800 text-white placeholder-indigo-300 focus:border-green-400 outline-none" required>
                        <textarea id="bio" placeholder="Short bio or project idea..." class="smooth-transition w-full p-3.5 rounded-xl bg-indigo-900 border border-indigo-800 text-white placeholder-indigo-300 h-24 resize-none focus:border-green-400 outline-none" required></textarea>
                        
                        <button type="submit" class="smooth-transition w-full bg-green-400 text-indigo-950 font-bold py-3.5 rounded-xl hover:bg-green-300 hover:scale-[1.02] active:scale-[0.98]">
                            Publish My Listing 🚀
                        </button>
                    </form>
                </div>
            </aside>

            <!-- RIGHT COLUMN -->
            <main class="md:col-span-8 animate-fadeInUp delay-2 opacity-0">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-950 tracking-tight">Available Hackers</h2>
                    <span id="hacker-count" class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-1 rounded-full">0 found</span>
                </div>
                
                <div id="feed" class="space-y-5">
                    <div class="animate-pulse flex space-x-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div class="rounded-full bg-gray-200 h-12 w-12"></div>
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded"></div>
                                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- FOOTER -->
        <footer class="mt-20 py-8 border-t border-gray-100 text-center text-gray-400 text-sm animate-fadeInUp delay-3 opacity-0">
            Built for the Hackers.
        </footer>
    </div>

    <!-- SINGLE FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your real Config
        const firebaseConfig = {
            apiKey: "AIzaSyDKjgQ7BqBir7fN5c9VZTmvhpFTL_3I_KA",
            authDomain: "devmatchmaker-4b3d3.firebaseapp.com",
            projectId: "devmatchmaker-4b3d3",
            storageBucket: "devmatchmaker-4b3d3.firebasestorage.app",
            messagingSenderId: "776913740126",
            appId: "1:776913740126:web:02433be2e1437fe4f56fcf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let allProfiles = [];

        // AUTH LOGIC (Cleaned up duplicate)
        window.login = (event) => {
            const btn = document.querySelector('button[onclick="login()"]');
            const originalText = btn.innerText;
            btn.innerText = "Connecting..."; 
    
            signInWithPopup(auth, provider)
            .catch(err => {
                btn.innerText = originalText; 
                console.error("Login Error:", err);
            });
        };
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').innerHTML = `
                    <div class="flex items-center gap-3 animate-fadeInUp">
                        <span class="text-sm text-gray-500 font-medium">Hello, ${user.displayName.split(' ')[0]}</span>
                        <img src="${user.photoURL}" class="w-11 h-11 rounded-full border-2 border-indigo-100 shadow-inner">
                        <button onclick="auth.signOut()" class="text-xs text-gray-400 underline hover:text-red-500 smooth-transition">Logout</button>
                    </div>`;
                
                const formContainer = document.getElementById('profile-form-container');
                formContainer.classList.remove('hidden');
                setTimeout(() => {
                    formContainer.classList.remove('translate-y-10', 'opacity-0');
                }, 100);
            } else {
                // If logged out, reload to reset UI
                if(currentUser) window.location.reload(); 
            }
        });

        // MATCHING ALGORITHM
        const getMatchScore = (search, userSkills) => {
            if (!search) return 0;
            const searchTerms = search.toLowerCase().split(/[\s,]+/).filter(Boolean);
            const skills = userSkills.toLowerCase().split(/[\s,]+/).filter(Boolean);
            const matches = searchTerms.filter(s => skills.includes(s));
            return Math.round((matches.length / searchTerms.length) * 100);
        };

        // REAL-TIME DATA LISTENER
        const feedEl = document.getElementById('feed');
        const hackerCountEl = document.getElementById('hacker-count');
        const q = query(collection(db, "hackers"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderFeed();
        }, (error) => {
            console.error("Database Error (Did you enable Test Mode?):", error);
        });

        // RENDER UI
        window.renderFeed = () => {
            const searchVal = document.getElementById('skillSearch').value;
            
            const scored = allProfiles.map(p => ({
                ...p,
                score: getMatchScore(searchVal, p.skills)
            })).sort((a, b) => b.score - a.score);

            hackerCountEl.innerText = `${scored.length} found`;

            if (scored.length === 0) {
                feedEl.innerHTML = `<div class="text-center py-20 text-gray-400 animate-fadeInUp font-medium">No hackers have joined yet... Be the first!</div>`;
                return;
            }

            feedEl.innerHTML = scored.map((p, index) => {
                const delayClass = index < 5 ? `delay-${index+1}` : '';
                const cardBorder = p.score > 50 ? 'border-green-400 bg-green-50/50' 
                                 : p.score > 0 ? 'border-indigo-200' 
                                 : 'border-gray-100';

                return `
                <div class="smooth-transition bg-white p-6 rounded-2xl border-2 ${cardBorder} shadow-sm hover:shadow-md flex items-start gap-5 animate-fadeInUp ${delayClass} opacity-0">
                    <img src="${p.photo}" class="w-14 h-14 rounded-full shadow-inner mt-1">
                    <div class="flex-1">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h3 class="font-bold text-gray-950 text-lg leading-tight">${p.name}</h3>
                                <p class="text-indigo-600 font-semibold text-sm mt-1 uppercase tracking-wider">${p.role}</p>
                            </div>
                            ${p.score > 0 ? `<span class="smooth-transition flex-shrink-0 animate-pulse bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">${p.score}% Match</span>` : ''}
                        </div>
                        <p class="text-gray-600 mt-3 text-sm leading-relaxed">${p.bio}</p>
                        
                        <div class="mt-4 flex flex-wrap gap-2">
                            ${p.skills.split(',').map(s => `<span class="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wide">${s.trim()}</span>`).join('')}
                        </div>
                        
                        <div class="mt-5 pt-4 border-t border-gray-100 flex justify-end">
                            <a href="mailto:${p.email}?subject=DevMatchMaker Team Invite" class="smooth-transition text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1.5 hover:gap-2">
                                SEND INVITE
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        };

        // SUBMIT FORM
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return alert("Please login first!");
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Publishing... 🚀";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "hackers"), {
                    name: currentUser.displayName,
                    email: currentUser.email,
                    photo: currentUser.photoURL,
                    role: document.getElementById('role').value,
                    skills: document.getElementById('skills').value,
                    bio: document.getElementById('bio').value,
                    createdAt: serverTimestamp()
                });
                e.target.reset();
            } catch (err) {
                console.error("Error adding document: ", err);
                alert("Submission failed. Make sure your Firestore rules are set to Test Mode!");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
