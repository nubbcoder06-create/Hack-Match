<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevMatchMaker | Premium Hacker Matchmaking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        dark: '#0a0a0c',
                        accent: '#6366f1',
                        glass: 'rgba(255, 255, 255, 0.03)'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a0a0c; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0a0c 50%); min-height: 100vh; }
        .glass-card { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hacker-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hacker-card:hover { border-color: #6366f1; box-shadow: 0 0 25px rgba(99, 102, 241, 0.15); transform: translateY(-4px) scale(1.01); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 10px; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
        
        /* Custom Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-200">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-50 glass-card border-b border-white/5 px-4 py-3 mb-6 shadow-2xl shadow-black/50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 group cursor-pointer" onclick="window.scrollTo(0,0)">
                <div class="bg-accent p-1.5 rounded-lg animate__animated animate__pulse animate__infinite">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight text-white hidden sm:block">Dev<span class="text-accent">Match</span></h1>
            </div>

            <div id="auth-section" class="flex items-center gap-4">
                <button onclick="login()" class="bg-white text-black px-6 py-2.5 rounded-full font-bold text-sm transition-all hover:bg-accent hover:text-white active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:shadow-[0_0_20px_rgba(99,102,241,0.5)]">
                    Sign In with Google
                </button>
            </div>
        </div>
    </nav>

    <div id="app" class="max-w-7xl mx-auto px-4 pb-12">
        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- LEFT COLUMN: CONTROLS -->
            <aside class="lg:col-span-4 space-y-6">
                
                <!-- Search -->
                <div class="glass-card p-6 rounded-3xl animate__animated animate__fadeInLeft">
                    <h2 class="text-white font-bold text-lg mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Filter Skills
                    </h2>
                    <div class="relative group">
                        <input type="text" id="skillSearch" oninput="renderFeed()" placeholder="React, Python, AWS..." 
                            class="w-full bg-black/40 border border-white/10 rounded-2xl p-4 pl-12 focus:ring-2 focus:ring-accent/50 outline-none transition-all placeholder:text-slate-600 text-white">
                        <svg class="w-5 h-5 absolute left-4 top-4 text-slate-500 group-focus-within:text-accent transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </div>

                <!-- Post Form -->
                <div id="profile-form-container" class="hidden glass-card p-6 rounded-3xl animate__animated animate__fadeInUp">
                    <h2 class="text-white font-bold text-lg mb-4 flex justify-between items-center">
                        Deploy Profile 
                        <span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-1 rounded-md uppercase tracking-wider">Live</span>
                    </h2>
                    <form id="postForm" class="space-y-4">
                        <input type="text" id="role" placeholder="e.g. Lead Frontend" class="w-full bg-black/40 border border-white/10 rounded-xl p-3.5 outline-none focus:border-accent text-sm transition-colors" required>
                        <input type="text" id="skills" placeholder="Skills (comma separated)" class="w-full bg-black/40 border border-white/10 rounded-xl p-3.5 outline-none focus:border-accent text-sm transition-colors" required>
                        <textarea id="bio" placeholder="What are you building?" class="w-full bg-black/40 border border-white/10 rounded-xl p-3.5 h-24 outline-none focus:border-accent text-sm resize-none transition-colors" required></textarea>
                        <button type="submit" id="submitBtn" class="w-full bg-accent text-white font-bold py-3.5 rounded-xl hover:bg-indigo-400 transition-all shadow-lg shadow-accent/20 flex justify-center items-center gap-2">
                            Launch Profile 🚀
                        </button>
                    </form>
                </div>

                <!-- JUDGE DEMO MODE BUTTON -->
                <div class="pt-2 animate__animated animate__fadeInLeft delay-2">
                    <button onclick="injectDummyUser()" class="w-full glass-card border-dashed border-white/20 text-slate-400 font-semibold py-3 rounded-2xl hover:bg-white/5 hover:text-white hover:border-accent transition-all text-sm flex justify-center items-center gap-2 group">
                        <svg class="w-4 h-4 group-hover:animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        Simulate Demo User
                    </button>
                </div>
            </aside>

            <!-- RIGHT COLUMN: FEED -->
            <main class="lg:col-span-8">
                <div class="flex justify-between items-end mb-6 pl-2 border-l-4 border-accent">
                    <div class="ml-2">
                        <h2 class="text-3xl font-extrabold text-white tracking-tight">Active Hackers</h2>
                        <p class="text-slate-500 text-sm mt-1">Real-time matching based on your stack</p>
                    </div>
                    <span id="hacker-count" class="glass-card px-4 py-1.5 rounded-full text-xs font-bold text-accent shadow-inner">0 online</span>
                </div>
                
                <div id="feed" class="grid gap-5 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-1">
                    <!-- Cards will be injected here -->
                    <div class="animate-pulse glass-card p-8 rounded-3xl border-dashed border-white/10">
                        <div class="flex gap-4 items-center">
                            <div class="w-16 h-16 bg-white/5 rounded-2xl"></div>
                            <div class="flex-1 space-y-3">
                                <div class="h-5 bg-white/5 rounded w-1/3"></div>
                                <div class="h-3 bg-white/5 rounded w-1/2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- FIREBASE AND APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyDKjgQ7BqBir7fN5c9VZTmvhpFTL_3I_KA",
            authDomain: "devmatchmaker-4b3d3.firebaseapp.com",
            projectId: "devmatchmaker-4b3d3",
            storageBucket: "devmatchmaker-4b3d3.firebasestorage.app",
            messagingSenderId: "776913740126",
            appId: "1:776913740126:web:02433be2e1437fe4f56fcf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let allProfiles = [];

        // CUSTOM TOAST NOTIFICATION
        window.showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            const style = type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-red-500/10 border-red-500/30 text-red-400';
            toast.className = `glass-card border px-5 py-3.5 rounded-2xl shadow-2xl animate__animated animate__fadeInUp flex items-center gap-3 ${style}`;
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="font-bold text-sm">${message}</span>
            `;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('animate__fadeInUp', 'animate__fadeOutDown');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        };

        // LOGIN
        window.login = () => {
            signInWithPopup(auth, provider).catch(err => showToast(err.message, 'error'));
        };
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                showToast(`Welcome back, ${user.displayName.split(' ')[0]}!`);
                document.getElementById('auth-section').innerHTML = `
                    <div class="glass-card px-2 py-2 pr-4 rounded-full flex items-center gap-3 animate__animated animate__fadeIn">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full ring-2 ring-accent/50 shadow-lg">
                        <div class="hidden md:block text-xs">
                            <p class="font-bold text-white leading-tight">${user.displayName}</p>
                            <button onclick="auth.signOut()" class="text-slate-400 hover:text-red-400 transition-colors">Sign Out</button>
                        </div>
                    </div>`;
                document.getElementById('profile-form-container').classList.remove('hidden');
            } else if(currentUser) window.location.reload();
        });

        // MATCHING
        const getMatchScore = (search, userSkills) => {
            if (!search) return 0;
            const searchTerms = search.toLowerCase().split(/[\s,]+/).filter(Boolean);
            const skills = userSkills.toLowerCase().split(/[\s,]+/).filter(Boolean);
            const matches = searchTerms.filter(s => skills.some(us => us.includes(s)));
            return Math.round((matches.length / searchTerms.length) * 100);
        };

        // REALTIME DB
        const q = query(collection(db, "hackers"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderFeed();
        });

        // RENDER UI
        window.renderFeed = () => {
            const feedEl = document.getElementById('feed');
            const searchVal = document.getElementById('skillSearch').value;
            const scored = allProfiles.map(p => ({
                ...p,
                score: getMatchScore(searchVal, p.skills)
            })).sort((a, b) => b.score - a.score);

            document.getElementById('hacker-count').innerText = `${scored.length} matching`;

            if (scored.length === 0) {
                feedEl.innerHTML = `
                    <div class="glass-card p-12 rounded-3xl text-center animate__animated animate__fadeIn border-dashed border-white/10">
                        <div class="text-5xl mb-4 opacity-50">📡</div>
                        <h3 class="text-xl font-bold text-white mb-2">No hackers found</h3>
                        <p class="text-slate-400 text-sm">Adjust your filters or simulate a user using the demo button.</p>
                    </div>`;
                return;
            }

            feedEl.innerHTML = scored.map((p, i) => `
                <div class="hacker-card glass-card p-6 rounded-3xl flex flex-col sm:flex-row gap-6 animate__animated animate__fadeInUp" style="animation-delay: ${i * 0.05}s">
                    <div class="relative flex-shrink-0 mx-auto sm:mx-0">
                        <img src="${p.photo}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover shadow-2xl ring-1 ring-white/10">
                        ${p.score > 0 ? `<div class="absolute -top-3 -right-3 bg-gradient-to-br from-indigo-500 to-purple-500 text-[11px] font-extrabold px-2.5 py-1.5 rounded-xl animate-bounce text-white shadow-lg border border-white/20 shadow-accent/50">${p.score}% MATCH</div>` : ''}
                    </div>
                    <div class="flex-1 text-center sm:text-left">
                        <div class="flex flex-col sm:flex-row justify-between items-center sm:items-start mb-3">
                            <div>
                                <h3 class="text-white font-extrabold text-xl">${p.name}</h3>
                                <p class="text-accent text-xs font-bold uppercase tracking-widest mt-1">${p.role}</p>
                            </div>
                            <a href="mailto:${p.email}" class="mt-3 sm:mt-0 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-white transition-all text-sm font-bold flex items-center gap-2 border border-white/5 hover:border-white/20">
                                Connect
                                <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                        <p class="text-slate-400 text-sm mb-4 leading-relaxed line-clamp-2">${p.bio}</p>
                        <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
                            ${p.skills.split(',').map(s => `
                                <span class="bg-accent/10 text-indigo-300 px-3 py-1.5 rounded-lg text-[11px] font-bold uppercase border border-accent/20 tracking-wide">
                                    ${s.trim()}
                                </span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // HANDLE FORM
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<div class="loader"></div> Publishing...`;
            
            try {
                await addDoc(collection(db, "hackers"), {
                    name: currentUser.displayName,
                    email: currentUser.email,
                    photo: currentUser.photoURL,
                    role: document.getElementById('role').value,
                    skills: document.getElementById('skills').value,
                    bio: document.getElementById('bio').value,
                    createdAt: serverTimestamp()
                });
                showToast("Profile launched successfully!");
                e.target.reset();
            } catch (err) {
                showToast("Failed to post. Check DB rules.", "error");
            } finally {
                btn.innerHTML = `Launch Profile 🚀`;
            }
        });

        // DEMO MODE INJECTION
        window.injectDummyUser = async () => {
            const roles = ["Frontend Engineer", "Backend Dev", "UI/UX Designer", "Data Scientist", "DevOps"];
            const skillSets = ["React, Tailwind, Vercel", "Node, Express, MongoDB", "Figma, CSS, Framer", "Python, Pandas, SQL", "AWS, Docker, CI/CD"];
            const names = ["Alex J.", "Sarah M.", "David K.", "Elena R.", "James W."];
            const rIndex = Math.floor(Math.random() * roles.length);
            
            try {
                await addDoc(collection(db, "hackers"), {
                    name: names[rIndex],
                    email: `demo${Math.floor(Math.random()*1000)}@example.com`,
                    photo: `https://i.pravatar.cc/150?u=${Math.random()}`,
                    role: roles[rIndex],
                    skills: skillSets[rIndex],
                    bio: "I'm looking for a team to build an awesome AI tool this weekend. Let's connect!",
                    createdAt: serverTimestamp()
                });
                showToast(`Simulated User Injected!`, 'success');
            } catch(e) {
                showToast(`Demo injection failed.`, 'error');
            }
        };
    </script>
</body>
</html>
